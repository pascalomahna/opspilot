name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: opspilot_test
                    POSTGRES_USER: opspilot_ci
                    POSTGRES_PASSWORD: ci_only_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U opspilot_ci -d opspilot_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://opspilot_ci:ci_only_password@localhost:5432/opspilot_test
            TEST_DATABASE_URL: postgresql://opspilot_ci:ci_only_password@localhost:5432/opspilot_test

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install Python
              run: uv python install 3.14

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run tests
              run: uv run pytest
            
    docker-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build API image
              run: docker build --target api -t opspilot-api:test .