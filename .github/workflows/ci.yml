name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: opspilot_test
                    POSTGRES_USER: opspilot_ci
                    POSTGRES_PASSWORD: ci_only_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U opspilot_ci -d opspilot_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql+psycopg://opspilot_ci:ci_only_password@localhost:5432/opspilot_test
            TEST_DATABASE_URL: postgresql+psycopg://opspilot_ci:ci_only_password@localhost:5432/opspilot_test

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

            - name: Install Python
              run: uv python install 3.14

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run Ruff lint
              run: uv run ruff check .

            - name: Check Ruff formatting
              run: uv run ruff format --check .

            - name: Run mypy
              run: uv run mypy src tests

            - name: Run tests
              run: uv run pytest
            
    docker-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build API image
              run: docker build --target api -t opspilot-api:test .