[project]
name = "opspilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pascal Omahna", email = "pascal.omahna@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
opspilot = "opspilot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
]
